services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http --log=stdout --log-format=term web:5000
    environment:
       NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - web
